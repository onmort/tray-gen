<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LumenPnP IC Tray Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f1ea; --panel:#ffffff; --border:#e4ded2; --accent:#daa520;
    --text:#000; --dim:#000; --red:#000; --pw:340px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.45 "Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body { display:grid; grid-template-columns:var(--pw) 6px 1fr; grid-template-rows:100vh; }
  aside { overflow-y:auto; padding:18px 18px 28px; background:var(--panel); border-right:1px solid var(--border); }
  #divider { cursor:col-resize; background:transparent; position:relative; }
  #divider::after { content:""; position:absolute; inset:0 2px; background:var(--border); border-radius:2px; transition:background .15s; }
  #divider:hover::after, #divider.dragging::after { background:var(--accent); }
  main { position:relative; min-width:0; }
  canvas { display:block; width:100%; height:100%; }
  h1 { font-size:23px; font-weight:700; margin:0 0 2px; letter-spacing:.2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  #sizeLabel { margin-bottom:6px; }
  #span { margin-top:2px; margin-bottom:4px; }
  .sec { font-size:12px; font-weight:600; color:var(--dim); margin:20px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--border); }
  label { display:block; font-size:12px; color:var(--dim); margin:8px 0 3px; }
  select,input[type=number] { width:100%; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 9px; font-size:13px; font-family:inherit; }
  select::placeholder,input::placeholder { color:#000; opacity:1; }
  select:focus,input:focus { outline:none; border-color:var(--accent); }
  input[type=range] { width:100%; accent-color:var(--accent); margin-top:6px; }
  .row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .package-entry { margin:10px 0 14px; padding:10px; border:1px solid var(--border); border-radius:10px; }
  .package-entry-head { display:grid; grid-template-columns:minmax(0,1fr) 76px 34px; gap:6px; align-items:end; }
  .package-entry-head label, .package-entry .row label { margin-top:0; }
  .package-entry .row { margin-top:8px; }
  button.remove-part { width:34px; height:34px; margin:0; padding:0; font-size:18px; }
  button { width:100%; margin-top:8px; padding:10px; border-radius:10px; border:1px solid var(--border); background:#fbfaf7; color:var(--text); font-size:13px; font-family:inherit; font-weight:500; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#000; border-color:transparent; font-weight:700; }
  button.primary:hover:not(:disabled) { filter:brightness(1.07); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .hint { font-size:11px; color:var(--dim); margin-top:6px; }
  #hud { position:absolute; left:14px; bottom:12px; font-size:12px; color:#000; pointer-events:none; }
  #loading { position:absolute; inset:0; display:grid; place-items:center; color:var(--dim); font-size:13px; background:var(--bg); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "manifold": "./vendor/manifold.js"
} }
</script>
</head>
<body>
<aside>
  <h1>LumenPnP Tray Generator</h1>
  <div class="sub" id="sizeLabel">175 x 120 mm tray for the staging plate.</div>
  <label for="span">Width <span id="spanLabel">6 columns</span></label>
  <input id="span" type="range" min="1" max="6" step="1" value="6">

  <div class="sec">Mounting holes</div>
  <label for="screw">Screw size</label>
  <select id="screw">
    <option value="M4">M4 socket head</option>
    <option value="M3">M3 socket head</option>
  </select>

  <div class="sec">Packages</div>
  <div id="partsList"></div>
  <button id="addPart" type="button">Add package type</button>
  <label for="clearance">Clearance (mm)</label>
  <input id="clearance" type="number" step="0.05" min="0" max="1.5">
  <div class="hint">Dimensions should be full enclosing dimensions of component, including leads.</div>

  <div class="sec">Export</div>
  <button class="primary" id="dlStl" disabled>Download STL</button>
  <button id="dlStep" disabled>Download STEP</button>
</aside>
<div id="divider" title="Drag to resize"></div>
<main>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="loading">Loading geometry engine…</div>
</main>
<script type="module" src="./js/app.js"></script>
</body>
</html>
